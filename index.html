<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate UNO Web Edition</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg-gradient: radial-gradient(circle at center, #1b2838 0%, #0a0f16 100%);
    --card-w: 80px;
    --card-h: 120px;
    --uno-red: #ea2b2b;
    --uno-blue: #0084d6;
    --uno-green: #37a827;
    --uno-yellow: #f5b000;
    --uno-dark-pink: #d80064;
    --uno-dark-teal: #00c9b7;
    --uno-dark-purple: #6a1b9a;
    --uno-dark-orange: #f55100;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    font-family: 'Montserrat', 'Segoe UI', Tahoma, sans-serif;
    background: var(--bg-gradient);
    color: #fff;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Lobby Overlay */
  #lobby-screen {
    position: absolute;
    inset: 0;
    background: rgba(8, 12, 18, 0.96);
    z-index: 100;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
  }
  .title-logo {
    font-size: 4rem;
    font-weight: 900;
    font-style: italic;
    letter-spacing: 2px;
    text-shadow: 0 8px 24px rgba(234,43,43,0.6), 0 0 10px rgba(245,176,0,0.8);
    background: linear-gradient(180deg, #fff720, #ea2b2b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    transform: skew(-10deg);
  }
  .lobby-card {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 20px;
    padding: 25px 35px;
    width: 420px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  label { font-size: 0.85rem; text-transform: uppercase; color: #aaa; font-weight: 700; letter-spacing: 1px; }
  input, select {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 10px 14px;
    color: #fff;
    font-size: 1rem;
    outline: none;
    transition: 0.2s border;
  }
  input:focus, select:focus { border-color: #f5b000; }
  .btn-group { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    background: linear-gradient(135deg, #f5b000, #ea2b2b);
    border: none;
    color: white;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(234,43,43,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    text-transform: uppercase;
  }
  .btn.secondary {
    background: rgba(255,255,255,0.1);
    box-shadow: none;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245,176,0,0.5); }
  .btn:active { transform: translateY(1px); }

  /* Game Board View */
  #game-arena {
    width: 100vw;
    height: 100vh;
    position: relative;
    perspective: 1200px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Ubisoft Stage Table */
  .table-felt {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotateX(25deg);
    width: 780px;
    height: 480px;
    border-radius: 200px;
    background: radial-gradient(ellipse at center, #005a9e 0%, #002244 80%, #001020 100%);
    box-shadow: 0 0 60px rgba(0, 132, 214, 0.4), inset 0 0 30px rgba(0,0,0,0.8);
    border: 10px solid #14213d;
    z-index: 1;
    transition: background 0.8s ease, box-shadow 0.8s ease;
  }
  .table-felt.dark-side {
    background: radial-gradient(ellipse at center, #4a0e4e 0%, #1a0022 80%, #0a0010 100%);
    box-shadow: 0 0 70px rgba(216, 0, 100, 0.5), inset 0 0 30px rgba(0,0,0,0.9);
  }
  .table-felt.no-mercy {
    background: radial-gradient(ellipse at center, #400505 0%, #180000 80%, #050000 100%);
    box-shadow: 0 0 80px rgba(234, 43, 43, 0.6), inset 0 0 40px rgba(0,0,0,0.9);
  }

  /* Center Pile */
  .center-deck {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: flex;
    gap: 40px;
    z-index: 10;
    align-items: center;
  }

  /* Player Nodes */
  .player-spot {
    position: absolute;
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 20;
    transition: 0.3s transform ease;
  }
  .player-spot.active .avatar {
    box-shadow: 0 0 25px #f5b000, 0 0 10px #fff;
    border-color: #f5b000;
    transform: scale(1.1);
  }
  .avatar {
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #222;
    border: 3px solid rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.5rem;
    font-weight: 800;
    color: #fff;
    transition: 0.2s all;
    background-size: cover;
  }
  .player-tag {
    margin-top: 6px;
    background: rgba(0,0,0,0.7);
    padding: 3px 12px;
    border-radius: 12px;
    font-size: 0.8rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* Positioning Players */
  #player-bottom { bottom: 20px; left: 50%; transform: translateX(-50%); width: 100%; }
  #player-top { top: 25px; left: 50%; transform: translateX(-50%); }
  #player-left { left: 40px; top: 50%; transform: translateY(-50%); }
  #player-right { right: 40px; top: 50%; transform: translateY(-50%); }

  /* Card Hand UI */
  .hand {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    height: 150px;
    width: 100%;
    padding: 0 40px;
  }
  .hand .card {
    margin-left: -35px;
    transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), margin 0.2s;
    cursor: pointer;
  }
  .hand .card:first-child { margin-left: 0; }
  .hand .card:hover {
    transform: translateY(-35px) scale(1.15) !important;
    z-index: 50 !important;
    margin-right: 15px;
  }

  /* Opponent Hand counts */
  .opponent-cards {
    display: flex;
    gap: -25px;
    margin-top: 8px;
  }
  .opponent-card-back {
    width: 32px;
    height: 48px;
    background: linear-gradient(135deg, #111, #333);
    border: 2px solid #555;
    border-radius: 6px;
    margin-left: -20px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5);
  }
  .opponent-card-back:first-child { margin-left: 0; }

  /* Ubisoft Card Styling */
  .card {
    width: var(--card-w);
    height: var(--card-h);
    border-radius: 12px;
    position: relative;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4), inset 0 0 0 3px #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Arial Black', sans-serif;
    transform-style: preserve-3d;
    background: #111;
  }
  .card-inner {
    width: 100%;
    height: 100%;
    border-radius: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
  }
  .card-oval {
    width: 78%;
    height: 88%;
    background: #fff;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    transform: rotate(-25deg);
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: inset 0 0 8px rgba(0,0,0,0.25);
  }
  .card-val {
    font-size: 2.2rem;
    font-weight: 900;
    transform: rotate(25deg);
    text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
  }
  .card-corner {
    position: absolute;
    font-size: 0.8rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
  }
  .card-corner.top-left { top: 4px; left: 6px; }
  .card-corner.bottom-right { bottom: 4px; right: 6px; transform: rotate(180deg); }

  /* Card Colors */
  .c-red { background: var(--uno-red); }
  .c-blue { background: var(--uno-blue); }
  .c-green { background: var(--uno-green); }
  .c-yellow { background: var(--uno-yellow); }
  .c-wild {
    background: conic-gradient(var(--uno-red) 0deg 90deg, var(--uno-blue) 90deg 180deg, var(--uno-green) 180deg 270deg, var(--uno-yellow) 270deg 360deg);
  }
  /* Flip Dark Colors */
  .c-pink { background: var(--uno-dark-pink); }
  .c-teal { background: var(--uno-dark-teal); }
  .c-purple { background: var(--uno-dark-purple); }
  .c-orange { background: var(--uno-dark-orange); }
  .c-wild-dark {
    background: conic-gradient(var(--uno-dark-pink) 0deg 90deg, var(--uno-dark-teal) 90deg 180deg, var(--uno-dark-purple) 180deg 270deg, var(--uno-dark-orange) 270deg 360deg);
  }

  /* Card Action / Value Colors */
  .c-red .card-val { color: var(--uno-red); }
  .c-blue .card-val { color: var(--uno-blue); }
  .c-green .card-val { color: var(--uno-green); }
  .c-yellow .card-val { color: var(--uno-yellow); }
  .c-pink .card-val { color: var(--uno-dark-pink); }
  .c-teal .card-val { color: var(--uno-dark-teal); }
  .c-purple .card-val { color: var(--uno-dark-purple); }
  .c-orange .card-val { color: var(--uno-dark-orange); }
  .c-wild .card-val, .c-wild-dark .card-val {
    background: linear-gradient(45deg, #ea2b2b, #f5b000, #37a827, #0084d6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* Discard & Draw Stacks */
  .deck-pile {
    width: var(--card-w);
    height: var(--card-h);
    position: relative;
    cursor: pointer;
  }
  .deck-pile-back {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, #1f1f1f 0%, #000 100%);
    border: 3px solid #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
    font-size: 1.2rem;
    font-weight: 900;
    color: #f5b000;
    font-style: italic;
    transform: skew(-5deg);
  }

  /* UNO Call & Action Buttons */
  #uno-btn {
    position: absolute;
    right: 40px;
    bottom: 160px;
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle, #ea2b2b 30%, #a00 100%);
    border: 4px solid #fff;
    color: #fff;
    font-size: 1.3rem;
    font-weight: 900;
    font-style: italic;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(234,43,43,0.8);
    transform: scale(0.9);
    transition: 0.2s transform, 0.2s filter;
    z-index: 50;
    display: none;
  }
  #uno-btn.alert {
    display: block;
    animation: pulse 0.8s infinite alternate;
  }
  @keyframes pulse {
    0% { transform: scale(0.95); filter: brightness(1); }
    100% { transform: scale(1.15); filter: brightness(1.3); }
  }

  /* Color Chooser Dialog */
  #color-picker-modal {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 200;
    display: none;
    justify-content: center;
    align-items: center;
  }
  .color-wheel {
    width: 260px;
    height: 260px;
    border-radius: 50%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    padding: 8px;
    background: #111;
    box-shadow: 0 0 50px rgba(255,255,255,0.2);
    border: 3px solid #fff;
  }
  .color-segment {
    border-radius: 20px;
    cursor: pointer;
    transition: 0.15s transform;
  }
  .color-segment:hover { transform: scale(1.08); }

  /* Stack Counter Widget */
  #stack-badge {
    position: absolute;
    top: -25px;
    right: -25px;
    background: #ff0055;
    color: #fff;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 1.2rem;
    border: 3px solid #fff;
    box-shadow: 0 0 15px #ff0055;
    animation: bounce 0.6s infinite alternate;
  }
  @keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }

  /* Banner Alerts */
  #banner {
    position: absolute;
    top: 15%;
    left: 50%;
    transform: translateX(-50%) scale(0.8);
    background: linear-gradient(90deg, transparent, rgba(0,0,0,0.85), transparent);
    padding: 10px 60px;
    font-size: 2.2rem;
    font-weight: 900;
    color: #f5b000;
    text-shadow: 0 0 20px #ea2b2b;
    pointer-events: none;
    opacity: 0;
    transition: 0.4s all cubic-bezier(0.175, 0.885, 0.32, 1.275);
    z-index: 100;
    white-space: nowrap;
    text-transform: uppercase;
  }
  #banner.show {
    opacity: 1;
    transform: translateX(-50%) scale(1);
  }

  /* Direction Indicator */
  .direction-tracker {
    position: absolute;
    width: 220px;
    height: 220px;
    border: 3px dashed rgba(255,255,255,0.25);
    border-radius: 50%;
    pointer-events: none;
    animation: spin 10s linear infinite;
  }
  .direction-tracker.reverse {
    animation-direction: reverse;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }

  /* Mercy Rule Progress Bar */
  .mercy-bar-container {
    width: 60px;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    margin-top: 4px;
    overflow: hidden;
  }
  .mercy-bar-fill {
    height: 100%;
    background: #00ff66;
    width: 0%;
    transition: width 0.3s ease, background 0.3s ease;
  }
</style>
</head>
<body>

  <div id="lobby-screen">
    <div class="title-logo">UNO ULTIMATE</div>
    <div class="lobby-card">
      <div class="form-group">
        <label>Player Nickname</label>
        <input type="text" id="player-name" value="Player 1" maxlength="12">
      </div>
      <div class="form-group">
        <label>Game Edition</label>
        <select id="game-edition">
          <option value="classic">Standard UNO (Classic)</option>
          <option value="flip">UNO FLIP! (Light & Dark Sides)</option>
          <option value="nomercy">UNO Show 'Em NO MERCY!</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="startSoloGame()">Play vs Bots</button>
        <button class="btn secondary" onclick="createRoom()">Create Online Room</button>
      </div>

      <div class="form-group" style="margin-top: 5px;">
        <label>Join Friend's Room Code</label>
        <div style="display:flex; gap:8px;">
          <input type="text" id="join-room-id" placeholder="Paste Code Here">
          <button class="btn" style="flex:0 0 90px;" onclick="joinRoom()">Join</button>
        </div>
      </div>
      <div id="room-info" style="font-size: 0.85rem; color: #f5b000; text-align: center; display:none;"></div>
      <button id="start-hosted-btn" class="btn" style="display:none;" onclick="startHostedGame()">Start Multiplayer Game</button>
    </div>
  </div>

  <div id="game-arena">
    <div class="table-felt" id="table-felt">
      <div class="direction-tracker" id="dir-indicator" style="top: calc(50% - 110px); left: calc(50% - 110px);"></div>
    </div>

    <div class="center-deck">
      <div class="deck-pile" onclick="onDrawCardClick()">
        <div class="deck-pile-back" id="draw-stack-back">UNO</div>
      </div>

      <div class="deck-pile" id="discard-stack" style="cursor: default;">
        </div>
    </div>

    <div id="banner">REVERSE!</div>

    <button id="uno-btn" onclick="callUno()">UNO!</button>

    <div class="player-spot" id="player-top">
      <div class="avatar" id="p-avatar-1">🤖</div>
      <div class="player-tag"><span id="p-name-1">Bot 1</span> (<span id="p-count-1">7</span>)</div>
      <div class="mercy-bar-container" id="mercy-box-1" style="display:none;"><div class="mercy-bar-fill" id="mercy-bar-1"></div></div>
      <div class="opponent-cards" id="p-hand-1"></div>
    </div>

    <div class="player-spot" id="player-left">
      <div class="avatar" id="p-avatar-2">🤖</div>
      <div class="player-tag"><span id="p-name-2">Bot 2</span> (<span id="p-count-2">7</span>)</div>
      <div class="mercy-bar-container" id="mercy-box-2" style="display:none;"><div class="mercy-bar-fill" id="mercy-bar-2"></div></div>
      <div class="opponent-cards" id="p-hand-2"></div>
    </div>

    <div class="player-spot" id="player-right">
      <div class="avatar" id="p-avatar-3">🤖</div>
      <div class="player-tag"><span id="p-name-3">Bot 3</span> (<span id="p-count-3">7</span>)</div>
      <div class="mercy-bar-container" id="mercy-box-3" style="display:none;"><div class="mercy-bar-fill" id="mercy-bar-3"></div></div>
      <div class="opponent-cards" id="p-hand-3"></div>
    </div>

    <div class="player-spot" id="player-bottom">
      <div class="player-tag" style="margin-bottom: 8px;">
        <span id="p-name-0">You</span> &nbsp;|&nbsp; Cards: <span id="p-count-0">7</span>
      </div>
      <div class="hand" id="player-hand"></div>
    </div>
  </div>

  <div id="color-picker-modal">
    <div class="color-wheel" id="color-picker-wheel">
      </div>
  </div>

<script>
/**
 * AUDIO SYNTHESIZER (Web Audio API for Ubisoft-style dynamic sound effects)
 */
const AudioEngine = {
  ctx: null,
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  },
  playCard() {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(320, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.12);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.12);
  },
  draw() {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(400, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.09);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.09);
  },
  special() {
    this.init();
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, this.ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(650, this.ctx.currentTime + 0.25);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(); osc.stop(this.ctx.currentTime + 0.3);
  },
  uno() {
    this.init();
    [440, 554, 659, 880].forEach((freq, idx) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx*0.06);
      gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + idx*0.06 + 0.2);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(this.ctx.currentTime + idx*0.06);
      osc.stop(this.ctx.currentTime + idx*0.06 + 0.2);
    });
  }
};

/**
 * GAME STATE & CONFIGURATION
 */
let GameState = {
  edition: 'classic', // 'classic' | 'flip' | 'nomercy'
  flipSide: 'light',  // 'light' | 'dark'
  drawPile: [],
  discardPile: [],
  players: [],
  turnIndex: 0,
  direction: 1, // 1: CW, -1: CCW
  stackedDrawCount: 0,
  currentColor: 'red',
  unoCalledPlayers: new Set(),
  isHost: true,
  myPlayerId: 0,
  peer: null,
  connections: [],
  pendingWildCard: null
};

/**
 * DECK GENERATOR
 */
function buildDeck(edition) {
  let deck = [];
  let id = 1;

  if (edition === 'classic') {
    const colors = ['red', 'blue', 'green', 'yellow'];
    colors.forEach(col => {
      deck.push({ id: id++, color: col, value: '0', type: 'number' });
      for (let i = 1; i <= 9; i++) {
        deck.push({ id: id++, color: col, value: `${i}`, type: 'number' });
        deck.push({ id: id++, color: col, value: `${i}`, type: 'number' });
      }
      ['skip', 'reverse', '+2'].forEach(act => {
        deck.push({ id: id++, color: col, value: act, type: 'action' });
        deck.push({ id: id++, color: col, value: act, type: 'action' });
      });
    });
    for (let i = 0; i < 4; i++) {
      deck.push({ id: id++, color: 'wild', value: 'WILD', type: 'wild' });
      deck.push({ id: id++, color: 'wild', value: '+4', type: 'wild' });
    }
  } 
  else if (edition === 'flip') {
    const lightColors = ['red', 'blue', 'green', 'yellow'];
    const darkColors = ['pink', 'teal', 'purple', 'orange'];
    
    // In Flip, every card has a Light side & a Dark side
    for (let c = 0; c < 4; c++) {
      const lCol = lightColors[c];
      const dCol = darkColors[c];

      for (let num = 1; num <= 9; num++) {
        deck.push({
          id: id++,
          light: { color: lCol, value: `${num}`, type: 'number' },
          dark: { color: dCol, value: `${num}`, type: 'number' }
        });
      }
      // Flip specific actions
      deck.push({ id: id++, light: { color: lCol, value: 'FLIP', type: 'flip' }, dark: { color: dCol, value: 'FLIP', type: 'flip' } });
      deck.push({ id: id++, light: { color: lCol, value: '+1', type: 'action' }, dark: { color: dCol, value: '+5', type: 'action' } });
      deck.push({ id: id++, light: { color: lCol, value: 'skip', type: 'action' }, dark: { color: dCol, value: 'skip_all', type: 'action' } });
    }
    for (let i = 0; i < 4; i++) {
      deck.push({
        id: id++,
        light: { color: 'wild', value: 'WILD', type: 'wild' },
        dark: { color: 'wild-dark', value: 'WILD_COLOR', type: 'wild_draw_color' }
      });
    }
  } 
  else if (edition === 'nomercy') {
    const colors = ['red', 'blue', 'green', 'yellow'];
    colors.forEach(col => {
      for (let i = 0; i <= 9; i++) {
        deck.push({ id: id++, color: col, value: `${i}`, type: 'number' });
        deck.push({ id: id++, color: col, value: `${i}`, type: 'number' });
      }
      ['skip', 'reverse', '+2', '+4', 'discard_all'].forEach(act => {
        deck.push({ id: id++, color: col, value: act, type: 'action' });
        deck.push({ id: id++, color: col, value: act, type: 'action' });
      });
    });
    for (let i = 0; i < 4; i++) {
      deck.push({ id: id++, color: 'wild', value: '+6', type: 'wild' });
      deck.push({ id: id++, color: 'wild', value: '+10', type: 'wild' });
      deck.push({ id: id++, color: 'wild', value: 'wild_rev_+4', type: 'wild' });
    }
  }

  return shuffle(deck);
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/**
 * MULTIPLAYER NETWORKING (PeerJS)
 */
function createRoom() {
  const name = document.getElementById('player-name').value || 'Host';
  const edition = document.getElementById('game-edition').value;
  GameState.edition = edition;

  GameState.peer = new Peer();
  GameState.peer.on('open', (id) => {
    document.getElementById('room-info').style.display = 'block';
    document.getElementById('room-info').innerHTML = `Room Code: <b>${id}</b><br>Share this code with your friends!`;
    document.getElementById('start-hosted-btn').style.display = 'block';

    GameState.players = [{ id: 0, name: name, hand: [], isBot: false, conn: null }];
  });

  GameState.peer.on('connection', (conn) => {
    if (GameState.players.length >= 4) {
      conn.send({ type: 'ERROR', msg: 'Room is full (Max 4 Players)' });
      return;
    }
    conn.on('data', (data) => handleHostIncomingData(conn, data));
  });
}

function joinRoom() {
  const roomId = document.getElementById('join-room-id').value.trim();
  const name = document.getElementById('player-name').value || 'Guest';
  if (!roomId) return alert('Please enter a room code.');

  GameState.peer = new Peer();
  GameState.peer.on('open', () => {
    const conn = GameState.peer.connect(roomId);
    GameState.isHost = false;

    conn.on('open', () => {
      conn.send({ type: 'JOIN_REQ', name: name });
    });

    conn.on('data', (data) => {
      if (data.type === 'SYNC_STATE') {
        GameState.edition = data.state.edition;
        GameState.flipSide = data.state.flipSide;
        GameState.discardPile = data.state.discardPile;
        GameState.players = data.state.players;
        GameState.turnIndex = data.state.turnIndex;
        GameState.direction = data.state.direction;
        GameState.stackedDrawCount = data.state.stackedDrawCount;
        GameState.currentColor = data.state.currentColor;
        GameState.myPlayerId = data.yourId;

        document.getElementById('lobby-screen').style.display = 'none';
        renderGame();
      } else if (data.type === 'BANNER') {
        showBanner(data.text);
      }
    });
  });
}

function handleHostIncomingData(conn, data) {
  if (data.type === 'JOIN_REQ') {
    const newId = GameState.players.length;
    GameState.players.push({ id: newId, name: data.name, hand: [], isBot: false, conn: conn });
    document.getElementById('room-info').innerHTML += `<br>Joined: <b>${data.name}</b>`;
  } else if (data.type === 'PLAY_CARD') {
    playCard(data.playerId, data.cardIndex, data.chosenColor);
  } else if (data.type === 'DRAW_CARD') {
    playerDrawsCards(data.playerId, 1);
    nextTurn();
    broadcastState();
  } else if (data.type === 'CALL_UNO') {
    GameState.unoCalledPlayers.add(data.playerId);
    showBanner(`${GameState.players[data.playerId].name} CALLED UNO!`);
    AudioEngine.uno();
    broadcastState();
  }
}

function broadcastState() {
  if (!GameState.isHost) return;
  GameState.players.forEach(p => {
    if (p.conn && p.conn.open) {
      p.conn.send({
        type: 'SYNC_STATE',
        yourId: p.id,
        state: {
          edition: GameState.edition,
          flipSide: GameState.flipSide,
          discardPile: GameState.discardPile,
          players: GameState.players.map(pl => ({
            id: pl.id,
            name: pl.name,
            handCount: pl.hand.length,
            hand: pl.id === p.id ? pl.hand : [],
            isBot: pl.isBot
          })),
          turnIndex: GameState.turnIndex,
          direction: GameState.direction,
          stackedDrawCount: GameState.stackedDrawCount,
          currentColor: GameState.currentColor
        }
      });
    }
  });
  renderGame();
}

/**
 * INITIALIZING GAME MODES
 */
function startSoloGame() {
  const name = document.getElementById('player-name').value || 'You';
  GameState.edition = document.getElementById('game-edition').value;
  GameState.players = [
    { id: 0, name: name, hand: [], isBot: false },
    { id: 1, name: 'Alex Bot', hand: [], isBot: true },
    { id: 2, name: 'Sam Bot', hand: [], isBot: true },
    { id: 3, name: 'Taylor Bot', hand: [], isBot: true }
  ];
  document.getElementById('lobby-screen').style.display = 'none';
  initGameEngine();
}

function startHostedGame() {
  // Fill empty slots with bots up to 4 players
  const currentCount = GameState.players.length;
  for (let i = currentCount; i < 4; i++) {
    GameState.players.push({ id: i, name: `Bot ${i}`, hand: [], isBot: true, conn: null });
  }
  document.getElementById('lobby-screen').style.display = 'none';
  initGameEngine();
}

function initGameEngine() {
  GameState.drawPile = buildDeck(GameState.edition);
  GameState.discardPile = [];
  GameState.flipSide = 'light';
  GameState.stackedDrawCount = 0;
  GameState.direction = 1;
  GameState.turnIndex = 0;

  // Deal 7 cards to each player
  for (let i = 0; i < 7; i++) {
    GameState.players.forEach(p => {
      p.hand.push(GameState.drawPile.pop());
    });
  }

  // Draw first card onto discard stack (re-draw if wild)
  let firstCard = GameState.drawPile.pop();
  while (getCardFace(firstCard).color.startsWith('wild')) {
    GameState.drawPile.unshift(firstCard);
    firstCard = GameState.drawPile.pop();
  }
  GameState.discardPile.push(firstCard);
  GameState.currentColor = getCardFace(firstCard).color;

  updateThemeStyles();
  renderGame();
  broadcastState();
}

/**
 * FLIP / CARD COLOR RESOLVERS
 */
function getCardFace(card) {
  if (!card) return { color: 'red', value: '0', type: 'number' };
  if (GameState.edition === 'flip') {
    return GameState.flipSide === 'light' ? card.light : card.dark;
  }
  return card;
}

function updateThemeStyles() {
  const felt = document.getElementById('table-felt');
  felt.className = 'table-felt';
  if (GameState.edition === 'flip' && GameState.flipSide === 'dark') {
    felt.classList.add('dark-side');
  } else if (GameState.edition === 'nomercy') {
    felt.classList.add('no-mercy');
  }
}

/**
 * GAME ENGINE CORE (Play, Stack, Validate, Rules)
 */
function canPlayCard(card) {
  const topCard = GameState.discardPile[GameState.discardPile.length - 1];
  const face = getCardFace(card);
  const topFace = getCardFace(topCard);

  // If there's an active stacking penalty (e.g. +2, +4, +6, +10)
  if (GameState.stackedDrawCount > 0) {
    if (GameState.edition === 'nomercy') {
      // In No Mercy, players can stack equal or higher draw cards
      const getDrawVal = val => parseInt(val.replace('+', '').replace('wild_rev_', '')) || 0;
      return face.value.includes('+') && getDrawVal(face.value) >= getDrawVal(topFace.value);
    }
    return face.value === topFace.value || (face.value.includes('+') && topFace.value.includes('+'));
  }

  if (face.color === 'wild' || face.color === 'wild-dark') return true;
  if (face.color === GameState.currentColor) return true;
  if (face.value === topFace.value) return true;

  return false;
}

function playCard(playerId, cardIdx, chosenColor = null) {
  const player = GameState.players[playerId];
  const card = player.hand[cardIdx];
  const face = getCardFace(card);

  // Check UNO penalty: if player had 2 cards and didn't call UNO
  if (player.hand.length === 2 && !GameState.unoCalledPlayers.has(playerId)) {
    showBanner(`${player.name} FORGOT UNO! +2 Cards`);
    playerDrawsCards(playerId, 2);
  }

  player.hand.splice(cardIdx, 1);
  GameState.discardPile.push(card);
  AudioEngine.playCard();

  // Handle Wild Color Assignment
  if (face.color.startsWith('wild')) {
    GameState.currentColor = chosenColor || (GameState.flipSide === 'light' ? 'red' : 'pink');
  } else {
    GameState.currentColor = face.color;
  }

  // Handle Action Mechanics
  handleCardAction(face, playerId);

  // Check Mercy Elimination Rule (No Mercy edition: 25+ cards = eliminated)
  if (GameState.edition === 'nomercy') {
    GameState.players.forEach((p, idx) => {
      if (p.hand.length >= 25) {
        showBanner(`${p.name} MERCY KNOCKOUT (25+ Cards)!`);
        p.hand = [];
        p.eliminated = true;
      }
    });
  }

  // Check Win Condition
  if (player.hand.length === 0) {
    showBanner(`🏆 ${player.name} WINS! 🏆`);
    AudioEngine.uno();
    return;
  }

  broadcastState();
  renderGame();
}

function handleCardAction(face, playerId) {
  const val = face.value;

  // Stacking Draw Actions
  if (val === '+1') GameState.stackedDrawCount += 1;
  else if (val === '+2') GameState.stackedDrawCount += 2;
  else if (val === '+4' || val === 'wild_rev_+4') GameState.stackedDrawCount += 4;
  else if (val === '+5') GameState.stackedDrawCount += 5;
  else if (val === '+6') GameState.stackedDrawCount += 6;
  else if (val === '+10') GameState.stackedDrawCount += 10;

  if (val === 'reverse' || val === 'wild_rev_+4') {
    GameState.direction *= -1;
    showBanner('REVERSE!');
    AudioEngine.special();
  }

  if (val === 'skip') {
    showBanner('SKIP!');
    AudioEngine.special();
    nextTurn();
  }

  if (val === 'skip_all') {
    showBanner('SKIP EVERYONE!');
    AudioEngine.special();
    // Skips all other players so it's current player's turn again
    return;
  }

  if (val === 'FLIP') {
    GameState.flipSide = GameState.flipSide === 'light' ? 'dark' : 'light';
    showBanner(`FLIPPED TO ${GameState.flipSide.toUpperCase()} SIDE!`);
    AudioEngine.special();
    updateThemeStyles();
  }

  if (val === 'discard_all') {
    showBanner(`DISCARD ALL ${GameState.currentColor.toUpperCase()}!`);
    const player = GameState.players[playerId];
    player.hand = player.hand.filter(c => getCardFace(c).color !== GameState.currentColor);
  }

  // 7-0 Rule in No Mercy
  if (GameState.edition === 'nomercy') {
    if (val === '7') {
      showBanner(`${GameState.players[playerId].name} SWAPS HANDS!`);
      // Swap with next player
      const nextIdx = (playerId + GameState.direction + 4) % 4;
      const temp = GameState.players[playerId].hand;
      GameState.players[playerId].hand = GameState.players[nextIdx].hand;
      GameState.players[nextIdx].hand = temp;
    } else if (val === '0') {
      showBanner('0 RULE: HANDS PASS AROUND!');
      if (GameState.direction === 1) {
        const lastHand = GameState.players[3].hand;
        for (let i = 3; i > 0; i--) GameState.players[i].hand = GameState.players[i-1].hand;
        GameState.players[0].hand = lastHand;
      } else {
        const firstHand = GameState.players[0].hand;
        for (let i = 0; i < 3; i++) GameState.players[i].hand = GameState.players[i+1].hand;
        GameState.players[3].hand = firstHand;
      }
    }
  }

  nextTurn();
}

function nextTurn() {
  do {
    GameState.turnIndex = (GameState.turnIndex + GameState.direction + GameState.players.length) % GameState.players.length;
  } while (GameState.players[GameState.turnIndex].eliminated);

  // If next player must absorb stacked draw penalty
  const nextP = GameState.players[GameState.turnIndex];
  if (GameState.stackedDrawCount > 0 && !hasStackDefense(nextP)) {
    showBanner(`${nextP.name} DRAWS +${GameState.stackedDrawCount}!`);
    playerDrawsCards(GameState.turnIndex, GameState.stackedDrawCount);
    GameState.stackedDrawCount = 0;
    nextTurn();
    return;
  }

  // Trigger AI if turn belongs to Bot
  if (nextP.isBot) {
    setTimeout(executeBotTurn, 1000);
  }
}

function hasStackDefense(player) {
  return player.hand.some(card => canPlayCard(card));
}

function playerDrawsCards(playerId, count) {
  const p = GameState.players[playerId];
  for (let i = 0; i < count; i++) {
    if (GameState.drawPile.length === 0) {
      const top = GameState.discardPile.pop();
      GameState.drawPile = shuffle(GameState.discardPile);
      GameState.discardPile = [top];
    }
    if (GameState.drawPile.length > 0) {
      p.hand.push(GameState.drawPile.pop());
    }
  }
  AudioEngine.draw();
}

/**
 * BOT AI ENGINE
 */
function executeBotTurn() {
  const bot = GameState.players[GameState.turnIndex];
  if (!bot || !bot.isBot) return;

  // Bot calls UNO when down to 2 cards
  if (bot.hand.length === 2 && Math.random() < 0.9) {
    GameState.unoCalledPlayers.add(bot.id);
    showBanner(`${bot.name} CALLED UNO!`);
    AudioEngine.uno();
  }

  const validIndexes = [];
  bot.hand.forEach((card, idx) => {
    if (canPlayCard(card)) validIndexes.push(idx);
  });

  if (validIndexes.length > 0) {
    const chosenIdx = validIndexes[Math.floor(Math.random() * validIndexes.length)];
    const card = bot.hand[chosenIdx];
    const face = getCardFace(card);
    let chosenCol = 'red';
    if (face.color.startsWith('wild')) {
      const pool = GameState.flipSide === 'light' ? ['red', 'blue', 'green', 'yellow'] : ['pink', 'teal', 'purple', 'orange'];
      chosenCol = pool[Math.floor(Math.random() * pool.length)];
    }
    playCard(bot.id, chosenIdx, chosenCol);
  } else {
    // Draw
    if (GameState.stackedDrawCount > 0) {
      playerDrawsCards(bot.id, GameState.stackedDrawCount);
      GameState.stackedDrawCount = 0;
    } else {
      playerDrawsCards(bot.id, 1);
    }
    nextTurn();
    broadcastState();
    renderGame();
  }
}

/**
 * LOCAL HUMAN INTERACTIONS
 */
function onHumanCardClick(idx) {
  if (GameState.turnIndex !== GameState.myPlayerId) return;
  const card = GameState.players[GameState.myPlayerId].hand[idx];
  if (!canPlayCard(card)) return;

  const face = getCardFace(card);
  if (face.color.startsWith('wild')) {
    GameState.pendingWildCard = idx;
    openColorPicker();
  } else {
    if (GameState.isHost) {
      playCard(GameState.myPlayerId, idx);
    } else {
      GameState.players[0].conn.send({ type: 'PLAY_CARD', playerId: GameState.myPlayerId, cardIndex: idx });
    }
  }
}

function onDrawCardClick() {
  if (GameState.turnIndex !== GameState.myPlayerId) return;
  if (GameState.isHost) {
    if (GameState.stackedDrawCount > 0) {
      playerDrawsCards(GameState.myPlayerId, GameState.stackedDrawCount);
      GameState.stackedDrawCount = 0;
    } else {
      playerDrawsCards(GameState.myPlayerId, 1);
    }
    nextTurn();
    broadcastState();
    renderGame();
  } else {
    GameState.players[0].conn.send({ type: 'DRAW_CARD', playerId: GameState.myPlayerId });
  }
}

function callUno() {
  if (GameState.isHost) {
    GameState.unoCalledPlayers.add(GameState.myPlayerId);
    showBanner('YOU CALLED UNO!');
    AudioEngine.uno();
    document.getElementById('uno-btn').classList.remove('alert');
  } else {
    GameState.players[0].conn.send({ type: 'CALL_UNO', playerId: GameState.myPlayerId });
  }
}

/**
 * COLOR PICKER POPUP
 */
function openColorPicker() {
  const modal = document.getElementById('color-picker-modal');
  const wheel = document.getElementById('color-picker-wheel');
  modal.style.display = 'flex';
  wheel.innerHTML = '';

  const colors = GameState.flipSide === 'light' 
    ? [{ c: 'red', code: 'var(--uno-red)' }, { c: 'blue', code: 'var(--uno-blue)' }, { c: 'green', code: 'var(--uno-green)' }, { c: 'yellow', code: 'var(--uno-yellow)' }]
    : [{ c: 'pink', code: 'var(--uno-dark-pink)' }, { c: 'teal', code: 'var(--uno-dark-teal)' }, { c: 'purple', code: 'var(--uno-dark-purple)' }, { c: 'orange', code: 'var(--uno-dark-orange)' }];

  colors.forEach(col => {
    const seg = document.createElement('div');
    seg.className = 'color-segment';
    seg.style.background = col.code;
    seg.onclick = () => {
      modal.style.display = 'none';
      if (GameState.isHost) {
        playCard(GameState.myPlayerId, GameState.pendingWildCard, col.c);
      } else {
        GameState.players[0].conn.send({
          type: 'PLAY_CARD',
          playerId: GameState.myPlayerId,
          cardIndex: GameState.pendingWildCard,
          chosenColor: col.c
        });
      }
    };
    wheel.appendChild(seg);
  });
}

/**
 * DOM RENDERING & ANIMATIONS
 */
function renderGame() {
  // Update Direction Indicator
  const dirEl = document.getElementById('dir-indicator');
  if (GameState.direction === -1) dirEl.classList.add('reverse');
  else dirEl.classList.remove('reverse');

  // Render Discard Pile (Top card)
  const discardBox = document.getElementById('discard-stack');
  const topCard = GameState.discardPile[GameState.discardPile.length - 1];
  discardBox.innerHTML = '';
  if (topCard) {
    discardBox.appendChild(createCardElement(topCard, false));
  }

  // Draw Stack Counter
  const drawBack = document.getElementById('draw-stack-back');
  drawBack.textContent = GameState.stackedDrawCount > 0 ? `+${GameState.stackedDrawCount}` : 'UNO';

  // Render Local Player Hand
  const myHandBox = document.getElementById('player-hand');
  myHandBox.innerHTML = '';
  const myPlayer = GameState.players[GameState.myPlayerId] || { hand: [] };
  
  myPlayer.hand.forEach((card, idx) => {
    const cardEl = createCardElement(card, true);
    cardEl.onclick = () => onHumanCardClick(idx);
    myHandBox.appendChild(cardEl);
  });

  document.getElementById('p-count-0').textContent = myPlayer.hand.length;
  document.getElementById('p-name-0').textContent = myPlayer.name || 'You';

  // Active Highlight & UNO prompt
  const isMyTurn = GameState.turnIndex === GameState.myPlayerId;
  document.getElementById('player-bottom').classList.toggle('active', isMyTurn);
  
  if (myPlayer.hand.length === 2 && !GameState.unoCalledPlayers.has(GameState.myPlayerId)) {
    document.getElementById('uno-btn').classList.add('alert');
  } else {
    document.getElementById('uno-btn').classList.remove('alert');
  }

  // Render Opponents
  const opponentSpots = [
    { el: document.getElementById('player-top'), name: 'p-name-1', count: 'p-count-1', hand: 'p-hand-1', mercy: 'mercy-bar-1', mercyBox: 'mercy-box-1', id: 1 },
    { el: document.getElementById('player-left'), name: 'p-name-2', count: 'p-count-2', hand: 'p-hand-2', mercy: 'mercy-bar-2', mercyBox: 'mercy-box-2', id: 2 },
    { el: document.getElementById('player-right'), name: 'p-name-3', count: 'p-count-3', hand: 'p-hand-3', mercy: 'mercy-bar-3', mercyBox: 'mercy-box-3', id: 3 }
  ];

  opponentSpots.forEach(spot => {
    const opp = GameState.players[spot.id];
    if (opp) {
      spot.el.style.display = 'flex';
      spot.el.classList.toggle('active', GameState.turnIndex === spot.id);
      document.getElementById(spot.name).textContent = opp.name;
      const count = opp.hand ? opp.hand.length : (opp.handCount || 0);
      document.getElementById(spot.count).textContent = count;

      // Opponent Back Cards
      const oppHandEl = document.getElementById(spot.hand);
      oppHandEl.innerHTML = '';
      const renderCount = Math.min(count, 10);
      for (let i = 0; i < renderCount; i++) {
        const back = document.createElement('div');
        back.className = 'opponent-card-back';
        oppHandEl.appendChild(back);
      }

      // Mercy Gauge (No Mercy Mode)
      if (GameState.edition === 'nomercy') {
        document.getElementById(spot.mercyBox).style.display = 'block';
        const percent = Math.min((count / 25) * 100, 100);
        const bar = document.getElementById(spot.mercy);
        bar.style.width = `${percent}%`;
        bar.style.background = percent > 70 ? '#ff0055' : '#00ff66';
      }
    } else {
      spot.el.style.display = 'none';
    }
  });
}

function createCardElement(card, isInteractive) {
  const face = getCardFace(card);
  const cardDiv = document.createElement('div');
  cardDiv.className = `card c-${face.color}`;

  let displayVal = face.value;
  if (displayVal === 'skip') displayVal = '⊘';
  else if (displayVal === 'reverse') displayVal = '⇄';
  else if (displayVal === 'skip_all') displayVal = '⨂';
  else if (displayVal === 'FLIP') displayVal = '🗘';
  else if (displayVal === 'discard_all') displayVal = '🗑';

  cardDiv.innerHTML = `
    <div class="card-inner">
      <div class="card-corner top-left">${displayVal}</div>
      <div class="card-oval">
        <span class="card-val">${displayVal}</span>
      </div>
      <div class="card-corner bottom-right">${displayVal}</div>
    </div>
  `;

  return cardDiv;
}

function showBanner(text) {
  const banner = document.getElementById('banner');
  banner.textContent = text;
  banner.classList.add('show');
  setTimeout(() => banner.classList.remove('show'), 2200);
}
</script>
</body>
